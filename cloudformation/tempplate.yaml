
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Serverless Resume API using AWS services

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

Resources:

  # DynamoDB Table
  ResumeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResumeData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # API Gateway
  ResumeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ServerlessResumeAPI
      StageName: prod
      Auth:
        ApiKeyRequired: true
      UsagePlan:
        CreateUsagePlan: PER_API
        UsagePlanName: ResumeAPIUsagePlan
        Throttle:
          BurstLimit: 5
          RateLimit: 2
        Quota:
          Limit: 1000
          Period: MONTH

  # Lambda Function
  ResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ServerlessResumeFunction
      CodeUri: ../src/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ResumeTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResumeTable
      Events:

        Personal:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeApi
            Path: /personal
            Method: GET

        Experience:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeApi
            Path: /experience
            Method: GET

        Education:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeApi
            Path: /education
            Method: GET

        Skills:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeApi
            Path: /skills
            Method: GET

Outputs:

  ResumeApiURL:
    Description: API Gateway endpoint
    Value: !Sub "https://${ResumeApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"

  DynamoDBTableName:
    Description: Resume DynamoDB Table
    Value: !Ref ResumeTable

  LambdaFunctionName:
    Description: Resume Lambda Function
    Value: !Ref ResumeFunction